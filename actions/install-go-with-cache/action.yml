name: "Setup and Cache Go and Configure Private if needed"
description: "Setup Go with architecture-specific caching for modules and tools"
inputs:
  go-version:
    description: "The Go version to download and use. Supports semver spec and ranges. When set, go-version-file is ignored."
    default: ""
  go-version-file:
    description: "Path to the go.mod or go.work file to extract the version from. Defaults to go.mod so projects automatically use the version declared in their module. Ignored when go-version is set. If the file does not exist, Go 1.26 is installed and a warning is emitted."
    default: "go.mod"
  gh_token:
    description: "GitHub Personal Access Token"

runs:
  using: "composite"
  steps:
    # Without this, a missing version file fails setup-go outright. Repos that never
    # checked out, or that have no go.mod at all, worked until go-version-file became
    # the default. Fall back to Go 1.26 for that case.
    - name: Fall back when the Go version file is missing
      id: fallback
      if: ${{ inputs.go-version == '' }}
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        if [ ! -e "$GO_VERSION_FILE" ]; then
          echo "::warning title=Go version file not found::The configured go-version-file does not exist in the workspace, so Go 1.26 is installed instead. Run actions/checkout before this action, or pass go-version explicitly to silence this warning."
          echo "go-version=1.26" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version || steps.fallback.outputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && steps.fallback.outputs.go-version == '' && inputs.go-version-file || '' }}
        cache: false

    - name: Detect GOMODCACHE path
      id: go-cache-paths
      shell: bash
      run: |
        GOMODCACHE=$(go env GOMODCACHE)
        # Fallback to default location if empty
        if [ -z "$GOMODCACHE" ]; then
          GOMODCACHE="$HOME/go/pkg/mod"
        fi
        # Ensure directory exists to prevent cache action warning
        mkdir -p "$GOMODCACHE"
        echo "gomodcache=$GOMODCACHE" >> $GITHUB_OUTPUT

    - name: Detect GOBIN path
      id: go-bin-path
      shell: bash
      run: |
        GOBIN=$(go env GOBIN)
        if [ -z "$GOBIN" ]; then
          GOBIN="$(go env GOPATH)/bin"
        fi
        mkdir -p "$GOBIN"
        echo "path=$GOBIN" >> $GITHUB_OUTPUT

    # Cache keys include github.job to prevent conflicts between jobs that
    # download different subsets of modules (e.g., a lint job vs a build job).
    # This ensures each job maintains its own cache without polluting others.
    - name: Go Modules Cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.gomodcache }}
        key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

    - name: Go Tools Cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.go-bin-path.outputs.path }}
        key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          go-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

    - name: Setup Git Private Module
      if: ${{ inputs.gh_token != '' }}
      shell: bash
      run: git config --global url.https://${{ inputs.gh_token }}@github.com/.insteadOf https://github.com/
